// Additive opt-in live-control contract. The existing coordinator.proto and its
// observation-only/ordinary command services remain byte-compatible.
syntax = "proto3";

package highbar.v1;

import "highbar/commands.proto";

service HighBarLiveControl {
  // Priority authority path. This stream never carries gameplay batches.
  rpc OpenLiveControlChannel(LiveControlSubscribe)
      returns (stream LiveControlDirective);
  rpc ReportLiveControlAck(LiveControlAckReport)
      returns (LiveControlAckResponse);

  // Independent bounded gameplay path. Admission continues to report through
  // the existing correlated CommandBatchResult carrier.
  rpc OpenLiveCommandChannel(LiveCommandSubscribe)
      returns (stream LiveCommandBatch);

  // Native-authored capability and snapshot metadata. This is the only source
  // of live unit lifetimes and eligibility; browser/client echoes are never
  // authoritative.
  rpc ReportLiveState(LiveStateReport)
      returns (LiveStateReportAck);
}

enum LiveControlProtocol {
  LIVE_CONTROL_PROTOCOL_UNSPECIFIED = 0;
  LIVE_CONTROL_PROTOCOL_V1 = 1;
  // Tactical v1 is additive. A V1 peer must refuse every tactical body.
  LIVE_CONTROL_PROTOCOL_TACTICAL_V1 = 2;
}

enum LiveControlDirectiveKind {
  LIVE_CONTROL_DIRECTIVE_KIND_UNSPECIFIED = 0;
  LIVE_CONTROL_DIRECTIVE_KIND_ARM = 1;
  LIVE_CONTROL_DIRECTIVE_KIND_RENEW = 2;
  LIVE_CONTROL_DIRECTIVE_KIND_REVOKE = 3;
}

enum LiveControlAckDisposition {
  LIVE_CONTROL_ACK_DISPOSITION_UNSPECIFIED = 0;
  LIVE_CONTROL_ACK_RECORDED = 1;
  LIVE_CONTROL_ACK_DUPLICATE = 2;
  LIVE_CONTROL_ACK_STALE = 3;
  LIVE_CONTROL_ACK_REFUSED = 4;
}

enum LiveSemanticAction {
  LIVE_SEMANTIC_ACTION_UNSPECIFIED = 0;
  LIVE_SEMANTIC_ACTION_STOP = 1;
  LIVE_SEMANTIC_ACTION_MOVE_REPLACE = 2;
  LIVE_SEMANTIC_ACTION_MOVE_APPEND = 3;
  LIVE_SEMANTIC_ACTION_ATTACK_VISIBLE_UNIT = 4;
  LIVE_SEMANTIC_ACTION_BUILD = 5;
  LIVE_SEMANTIC_ACTION_GUARD = 6;
  LIVE_SEMANTIC_ACTION_REPAIR = 7;
  LIVE_SEMANTIC_ACTION_RECLAIM_UNIT = 8;
  LIVE_SEMANTIC_ACTION_RECLAIM_FEATURE = 9;
  LIVE_SEMANTIC_ACTION_RECLAIM_AREA = 10;
  LIVE_SEMANTIC_ACTION_FACTORY_PRODUCE = 11;
  LIVE_SEMANTIC_ACTION_SET_RALLY = 12;
  LIVE_SEMANTIC_ACTION_QUEUE_EDIT = 13;
  LIVE_SEMANTIC_ACTION_BAR_CONSTRUCTION_PRIORITY = 14;
  LIVE_SEMANTIC_ACTION_BAR_CLOAK_DESIRE = 15;
}

enum LiveFenceReason {
  LIVE_FENCE_REASON_UNSPECIFIED = 0;
  LIVE_FENCE_AUTHORITY_NOT_CONFIRMED = 1;
  LIVE_FENCE_AUTHORITY_REVOKED = 2;
  LIVE_FENCE_LEASE_EXPIRED = 3;
  LIVE_FENCE_BASIS_UNKNOWN = 4;
  LIVE_FENCE_BASIS_EXPIRED = 5;
  LIVE_FENCE_ACTOR_NOT_OWNED = 6;
  LIVE_FENCE_ACTOR_DEAD = 7;
  LIVE_FENCE_ACTOR_LIFETIME_CHANGED = 8;
  LIVE_FENCE_TARGET_NOT_VISUAL = 9;
  LIVE_FENCE_TARGET_DEAD = 10;
  LIVE_FENCE_TARGET_LIFETIME_CHANGED = 11;
  LIVE_FENCE_CAPABILITY_CHANGED = 12;
  LIVE_FENCE_COMMAND_EXPIRED = 13;
  LIVE_FENCE_TACTICAL_PROFILE_REQUIRED = 14;
  LIVE_FENCE_CATALOGUE_INCOMPLETE = 15;
  LIVE_FENCE_CATALOGUE_CHANGED = 16;
  LIVE_FENCE_DEFINITION_UNAVAILABLE = 17;
  LIVE_FENCE_TARGET_NOT_FRIENDLY = 18;
  LIVE_FENCE_FEATURE_UNAVAILABLE = 19;
  LIVE_FENCE_FEATURE_LIFETIME_CHANGED = 20;
  LIVE_FENCE_QUEUE_CHANGED = 21;
  LIVE_FENCE_QUEUE_TAG_CHANGED = 22;
  LIVE_FENCE_PLACEMENT_REFUSED = 23;
  LIVE_FENCE_PARAMETER_REFUSED = 24;
  LIVE_FENCE_RESOURCE_UNAVAILABLE = 25;
}

enum LiveStateReportDisposition {
  LIVE_STATE_REPORT_DISPOSITION_UNSPECIFIED = 0;
  LIVE_STATE_REPORT_RECORDED = 1;
  LIVE_STATE_REPORT_DUPLICATE = 2;
  LIVE_STATE_REPORT_STALE = 3;
  LIVE_STATE_REPORT_REFUSED = 4;
}

enum NativeLiveUnitEligibility {
  NATIVE_LIVE_UNIT_ELIGIBILITY_UNSPECIFIED = 0;
  NATIVE_LIVE_UNIT_OWNED_ACTOR = 1;
  NATIVE_LIVE_UNIT_VISUAL_TARGET = 2;
}

message LiveBinding {
  string plugin_id = 1;
  string process_incarnation = 2;
  bytes match_incarnation = 3;
  string command_channel_incarnation = 4;
  string control_channel_incarnation = 5;
  bytes broker_session_id = 6;
  bytes controller_id = 7;
  string controller_incarnation = 8;
  uint64 authority_epoch = 9;
  bytes module_sha256 = 10;
  uint64 module_generation = 11;
}

message LiveControlSubscribe {
  string plugin_id = 1;
  string schema_version = 2;
  LiveControlProtocol protocol = 3;
  string process_incarnation = 4;
  bytes match_incarnation = 5;
  string command_channel_incarnation = 6;
  string control_channel_incarnation = 7;
}

message LiveControlDirective {
  LiveControlDirectiveKind kind = 1;
  LiveBinding binding = 2;
  uint64 control_sequence = 3;
  // Native converts this duration at receipt into a steady-clock deadline.
  uint32 lease_duration_ms = 4;
  string reason = 5;
}

message LiveControlAckReport {
  LiveBinding binding = 1;
  uint64 control_sequence = 2;
  LiveControlDirectiveKind kind = 3;
  LiveControlAckDisposition disposition = 4;
  string detail = 5;
}

message LiveControlAckResponse {
  LiveControlAckDisposition disposition = 1;
}

// Acknowledgment means the native authority gate has linearized the directive.
// Revoke prevents every later dispatch for the epoch, including queued work;
// it does not undo an engine order that was already issued.
message LiveCommandSubscribe {
  string plugin_id = 1;
  string schema_version = 2;
  LiveControlProtocol protocol = 3;
  LiveBinding binding = 4;
}

message NativeUnitReference {
  // Unit id 0 is legal; this nested message must be present.
  uint32 id = 1;
  uint64 lifetime = 2;
}

message NativeObservationBasis {
  bytes token = 1;
  uint64 state_sequence = 2;
  uint32 frame = 3;
  bytes match_incarnation = 4;
  string process_incarnation = 5;
  string state_channel_incarnation = 6;
  uint64 snapshot_send_monotonic_ns = 7;
  uint32 effective_cadence_frames = 8;
}

message LiveStateReporter {
  string plugin_id = 1;
  string schema_version = 2;
  LiveControlProtocol protocol = 3;
  string process_incarnation = 4;
  bytes match_incarnation = 5;
  string state_channel_incarnation = 6;
}

message NativeLiveUnitMetadata {
  NativeUnitReference reference = 1;
  NativeLiveUnitEligibility eligibility = 2;
}

message LiveSnapshotMetadata {
  NativeObservationBasis basis = 1;
  int32 perspective_team_id = 2;
  // Bounded by LiveNativeCapabilities.max_reported_units. Radar-only and
  // otherwise hidden enemy identities must not appear.
  repeated NativeLiveUnitMetadata units = 3;
}

message LiveStateReport {
  LiveStateReporter reporter = 1;
  uint64 report_sequence = 2;
  oneof body {
    LiveNativeCapabilities capabilities = 10;
    LiveSnapshotMetadata snapshot = 11;
    TacticalCataloguePage tactical_catalogue = 12;
    TacticalSnapshotMetadata tactical_snapshot = 13;
  }
}

message LiveStateReportAck {
  uint64 report_sequence = 1;
  LiveStateReportDisposition disposition = 2;
}

message LiveCommandAttribution {
  bytes parent_id = 1;
  string originating_client_id = 2;
  uint32 child_index = 3;
  uint32 child_count = 4;
  bytes input_id = 5;
}

message LiveCommandBatch {
  // Live v1 requires exactly one command in batch.commands. It must match
  // actor and semantic_action; extra legacy commands are refused rather than
  // inheriting the single actor fence.
  CommandBatch batch = 1;
  LiveBinding binding = 2;
  LiveCommandAttribution attribution = 3;
  NativeObservationBasis basis = 4;
  NativeUnitReference actor = 5;
  optional NativeUnitReference visible_attack_target = 6;
  LiveSemanticAction semantic_action = 7;

  // Remaining durations are computed by the broker at send time and converted
  // by native at receipt. Dispatch uses the earliest basis/command/lease
  // deadline and checks revocation again while holding the dispatch gate.
  uint32 remaining_basis_validity_ms = 8;
  uint32 remaining_command_lifetime_ms = 9;
  uint32 remaining_lease_validity_ms = 10;
  // Present only for LIVE_CONTROL_PROTOCOL_TACTICAL_V1. The legacy command
  // remains exactly one translated child and must match this typed intent.
  optional NativeTacticalCommand tactical_command = 11;
}

// Producer-advertised values have no schema defaults. Live arm is refused when
// any required bound is zero or the effective cadence exceeds the ceiling.
message LiveNativeCapabilities {
  uint32 max_actor_count = 1;
  uint32 max_batch_commands = 2;
  uint32 max_native_unit_id = 3;
  uint32 snapshot_cadence_ceiling_frames = 4;
  uint32 max_observation_age_ms = 5;
  uint32 map_width_cells = 6;
  uint32 map_height_cells = 7;
  float min_world_x = 8;
  float max_world_x_inclusive = 9;
  float min_world_z = 10;
  float max_world_z_inclusive = 11;
  bool terrain_elevation_available = 12;
  bool supports_stop = 13;
  bool supports_move = 14;
  bool supports_attack_visible_unit = 15;
  uint32 max_reported_units = 16;
  optional NativeTacticalCapabilities tactical = 17;
}

// ---- Additive tactical profile ------------------------------------------------

enum NativeQueuePolicy {
  NATIVE_QUEUE_POLICY_UNSPECIFIED = 0;
  NATIVE_QUEUE_POLICY_REPLACE = 1;
  NATIVE_QUEUE_POLICY_APPEND = 2;
  NATIVE_QUEUE_POLICY_REJECT_IF_BUSY = 3;
}

enum NativeBuildFacing {
  NATIVE_BUILD_FACING_UNSPECIFIED = 0;
  NATIVE_BUILD_FACING_NORTH = 1;
  NATIVE_BUILD_FACING_EAST = 2;
  NATIVE_BUILD_FACING_SOUTH = 3;
  NATIVE_BUILD_FACING_WEST = 4;
}

enum NativeQueueEditKind {
  NATIVE_QUEUE_EDIT_KIND_UNSPECIFIED = 0;
  NATIVE_QUEUE_EDIT_KIND_INSERT = 1;
  NATIVE_QUEUE_EDIT_KIND_REMOVE_TAG = 2;
  NATIVE_QUEUE_EDIT_KIND_SET_REPEAT = 3;
}

enum NativeQueueDomain {
  NATIVE_QUEUE_DOMAIN_UNSPECIFIED = 0;
  NATIVE_QUEUE_DOMAIN_ACTOR_ORDER = 1;
  NATIVE_QUEUE_DOMAIN_FACTORY_PRODUCTION = 2;
  NATIVE_QUEUE_DOMAIN_FACTORY_RALLY = 3;
}

// Queue revisions are meaningful only within their negotiated evidence
// scheme. Tactical v1 historically omitted this field; zero therefore keeps
// its full-native-tuple-v1 meaning only for that exact legacy profile.
enum NativeQueueEvidenceScheme {
  NATIVE_QUEUE_EVIDENCE_SCHEME_UNSPECIFIED = 0;
  NATIVE_QUEUE_EVIDENCE_SCHEME_FULL_NATIVE_TUPLE_V1 = 1;
  NATIVE_QUEUE_EVIDENCE_SCHEME_STOCK_LUA_SUPPORTED_FIELDS_V1 = 2;
}

enum NativeTacticalDescriptorKind {
  NATIVE_TACTICAL_DESCRIPTOR_KIND_UNSPECIFIED = 0;
  NATIVE_TACTICAL_DESCRIPTOR_BUILD = 1;
  NATIVE_TACTICAL_DESCRIPTOR_GUARD = 2;
  NATIVE_TACTICAL_DESCRIPTOR_REPAIR = 3;
  NATIVE_TACTICAL_DESCRIPTOR_RECLAIM_UNIT = 4;
  NATIVE_TACTICAL_DESCRIPTOR_RECLAIM_FEATURE = 5;
  NATIVE_TACTICAL_DESCRIPTOR_RECLAIM_AREA = 6;
  NATIVE_TACTICAL_DESCRIPTOR_FACTORY_PRODUCE = 7;
  NATIVE_TACTICAL_DESCRIPTOR_SET_RALLY = 8;
  NATIVE_TACTICAL_DESCRIPTOR_QUEUE_INSERT = 9;
  NATIVE_TACTICAL_DESCRIPTOR_QUEUE_REMOVE = 10;
  NATIVE_TACTICAL_DESCRIPTOR_QUEUE_REPEAT = 11;
  NATIVE_TACTICAL_DESCRIPTOR_BAR_CONSTRUCTION_PRIORITY = 12;
  NATIVE_TACTICAL_DESCRIPTOR_BAR_CLOAK_DESIRE = 13;
}

enum NativeTacticalModeValue {
  NATIVE_TACTICAL_MODE_VALUE_UNSPECIFIED = 0;
  NATIVE_TACTICAL_MODE_VALUE_DISABLED = 1;
  NATIVE_TACTICAL_MODE_VALUE_ENABLED = 2;
}

message NativeTacticalCapabilities {
  string profile = 1; // exact value: barc-live-tactical-v1
  uint32 revision = 2; // exact value: 1
  uint32 max_catalogue_entries = 3;
  uint32 max_catalogue_page_entries = 4;
  uint32 max_build_options_per_actor = 5;
  uint32 max_queue_entries_per_actor = 6;
  uint32 max_feature_references = 7;
  uint32 max_factory_production_count = 8;
  uint32 max_area_radius_world_units = 9;
  uint32 max_command_descriptors_per_actor = 10;
}

message NativeContentIdentity {
  string engine_version = 1;
  string game_name = 2;
  string game_version = 3;
  bytes game_content_sha256 = 4;
}

message NativeResourceCost {
  optional float metal = 1;
  optional float energy = 2;
  optional float build_time = 3;
}

message NativeUnitDefinition {
  // Definition id zero is invalid; unknown definitions remain absent.
  uint32 definition_id = 1;
  string internal_name = 2;
  string display_name = 3;
  uint32 footprint_x_cells = 4;
  uint32 footprint_z_cells = 5;
  NativeResourceCost cost = 6;
  repeated uint32 build_option_definition_ids = 7;
}

message TacticalCataloguePage {
  string tactical_profile = 1;
  uint32 tactical_revision = 2;
  NativeContentIdentity content = 3;
  bytes catalogue_id = 4;
  uint64 catalogue_revision = 5;
  uint32 page_index = 6;
  uint32 page_count = 7;
  bool complete = 8;
  repeated NativeUnitDefinition definitions = 9;
  // Empty only on the final page. Opaque and valid only for this catalogue id
  // and revision; a missing page makes the assembled catalogue incomplete.
  bytes next_page_token = 10;
}

message NativeFeatureReference {
  // Feature id 0 is legal; presence of this message distinguishes absence.
  uint32 id = 1;
  uint64 lifetime = 2;
}

message NativeFeatureMetadata {
  NativeFeatureReference reference = 1;
  uint32 definition_id = 2;
  float world_x = 3;
  optional float elevation = 4;
  float world_z = 5;
  optional float reclaim_left = 6;
}

message NativeEconomyValue {
  string resource_name = 1;
  string unit = 2;
  optional float current = 3;
  optional float storage = 4;
  optional float income_per_second = 5;
  optional float usage_per_second = 6;
}

message NativeEconomySnapshot {
  int32 perspective_team_id = 1;
  uint32 sample_frame = 2;
  NativeEconomyValue metal = 3;
  NativeEconomyValue energy = 4;
}

message NativeTacticalCommandDescriptor {
  NativeTacticalDescriptorKind kind = 1;
  bool disabled = 2;
  repeated uint32 allowed_definition_ids = 3;
  // Filled only for selected, typed BAR modes. Raw command ids and arbitrary
  // parameter vectors are never accepted from browser or guest input.
  optional int32 native_command_id = 4;
  repeated NativeTacticalModeValue allowed_mode_values = 5;
  optional NativeTacticalModeValue observed_mode_value = 6;
}

message NativeObservedQueueEntry {
  int32 native_tag = 1;
  LiveSemanticAction action = 2;
  optional uint32 definition_id = 3;
  optional NativeUnitReference unit_target = 4;
  optional NativeFeatureReference feature_target = 5;
  optional float world_x = 6;
  optional float world_z = 7;
}

message NativeActorTacticalMetadata {
  NativeUnitReference actor = 1;
  uint64 descriptor_revision = 2;
  repeated NativeTacticalCommandDescriptor descriptors = 3;
  repeated NativeObservedQueue queue = 4;
}

message NativeObservedQueue {
  NativeQueueDomain domain = 1;
  // Revision covers the complete ordered native tuple
  // (type,id,options,tag,timeout,params), even though this wire projection is
  // normalized and never grants raw options or arbitrary custom parameters.
  uint64 revision = 2;
  repeated NativeObservedQueueEntry entries = 3;
  bool complete = 4;
  optional bool repeat = 5;
  // barc-live-tactical-v1 revision 1 accepts zero (its historical default)
  // or FULL_NATIVE_TUPLE_V1. barc-live-tactical-stock-v1 revision 2 requires
  // STOCK_LUA_SUPPORTED_FIELDS_V1; zero, unknown and cross-profile values are
  // unavailable and cannot authorize an action.
  NativeQueueEvidenceScheme evidence_scheme = 6;
}

message TacticalSnapshotMetadata {
  NativeObservationBasis basis = 1;
  bytes catalogue_id = 2;
  uint64 catalogue_revision = 3;
  NativeEconomySnapshot economy = 4;
  repeated NativeActorTacticalMetadata actors = 5;
  repeated NativeFeatureMetadata features = 6;
}

message NativePosition3 {
  float x = 1;
  optional float elevation = 2;
  float z = 3;
}

message NativeBuildIntent {
  uint32 definition_id = 1;
  NativePosition3 position = 2;
  NativeBuildFacing facing = 3;
  NativeQueuePolicy queue_policy = 4;
}

message NativeFriendlyTargetIntent {
  NativeUnitReference target = 1;
  NativeQueuePolicy queue_policy = 2;
}

message NativeReclaimFeatureIntent {
  NativeFeatureReference target = 1;
  NativeQueuePolicy queue_policy = 2;
}

message NativeReclaimAreaIntent {
  NativePosition3 center = 1;
  float radius_world_units = 2;
  NativeQueuePolicy queue_policy = 3;
}

message NativeFactoryProduceIntent {
  uint32 definition_id = 1;
  // Always 1 on this per-actor native child. Browser counts are expanded and
  // reserved by the broker; engine modifier multipliers are never exposed.
  uint32 count = 2;
  NativeQueuePolicy queue_policy = 3;
}

message NativeSetRallyIntent {
  NativePosition3 position = 1;
}

message NativeQueueInsertIntent {
  int32 before_native_tag = 1;
  LiveSemanticAction action = 2;
  optional uint32 definition_id = 3;
  optional NativePosition3 position = 4;
  optional NativeUnitReference unit_target = 5;
  optional NativeFeatureReference feature_target = 6;
}

message NativeQueueEditIntent {
  uint64 expected_queue_revision = 1;
  NativeQueueEditKind kind = 2;
  NativeQueueDomain domain = 3;
  oneof edit {
    NativeQueueInsertIntent insert = 10;
    int32 remove_native_tag = 11;
    bool repeat = 12;
  }
}

message NativeTacticalModeIntent {
  NativeTacticalDescriptorKind kind = 1;
  NativeTacticalModeValue value = 2;
}

message NativeTacticalCommand {
  bytes catalogue_id = 1;
  uint64 catalogue_revision = 2;
  uint64 actor_descriptor_revision = 3;
  NativeQueueDomain queue_domain = 4;
  uint64 expected_queue_revision = 5;
  oneof action {
    NativeBuildIntent build = 10;
    NativeFriendlyTargetIntent guard = 11;
    NativeFriendlyTargetIntent repair = 12;
    NativeFriendlyTargetIntent reclaim_unit = 13;
    NativeReclaimFeatureIntent reclaim_feature = 14;
    NativeReclaimAreaIntent reclaim_area = 15;
    NativeFactoryProduceIntent factory_produce = 16;
    NativeSetRallyIntent set_rally = 17;
    NativeQueueEditIntent queue_edit = 18;
    NativeTacticalModeIntent tactical_mode = 19;
  }
}
