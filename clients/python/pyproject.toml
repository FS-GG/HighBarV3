# SPDX-License-Identifier: GPL-2.0-only
#
# HighBarV3 — Python client package (T084).
#
# Targets Python 3.11+. Generated gRPC/protobuf stubs are committed under
# highbar_client/highbar/; regenerate them with `make codegen` after
# installing the dev extra. Keep runtime floors aligned with their generator.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highbar-client"
version = "0.1.0"
description = "HighBarV3 gRPC client for Python — observer + AI roles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "HighBarV3 contributors" }
]
dependencies = [
    "grpcio >= 1.85.1",
    # grpcio-tools 1.85.1 emits protobuf 7.35.1 code.
    "protobuf >= 7.35.1, < 8",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools == 1.85.1",
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
]

[project.scripts]
hb-observer-py = "highbar_client.samples.observer:main"
hb-ai-client-py = "highbar_client.samples.ai_client:main"
hb-ai-runner-py = "highbar_client.ai_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["highbar_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
